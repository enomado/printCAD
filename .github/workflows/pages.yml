name: Pages

# The website: site/ (landing page, stylesheet, pictures) and every guide
# in docs/ turned into a page by scripts/build-site.sh, published to
# GitHub Pages on each push to master that touches them; and printCAD in
# the browser under app/, the page the latest release carries
# (printcad-web-X.Y.Z.tar.gz), published again once a release is out.

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/build-site.sh"
      - "crates/app_shell/assets/icon/**"
      - "crates/ui_kit/fonts/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # After a release, only one that went through.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      # Pinned: the code colours read the classes this version's
      # highlighter gives.
      - name: Pandoc
        run: |
          curl -sSLo pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i pandoc.deb
          rm pandoc.deb

      - name: Build the site
        run: scripts/build-site.sh _site

      # The latest release's page, when it carries one.
      - name: The browser app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'printcad-web-*.tar.gz' --dir web 2>/dev/null; then
            mkdir -p _site/app
            tar xzf web/printcad-web-*.tar.gz -C _site/app
          else
            echo "the latest release carries no browser page"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
