name: Release

# A tag `vX.Y.Z` builds printCAD for Linux, Windows and macOS, and the
# browser page (published on the website by pages.yml), and publishes the
# packages as a GitHub release, its text the version's section of
# crates/app_shell/RELEASE_NOTES.md. The tag must name the app's version.
# Run by hand with a tag, it builds and publishes that tag: how a release
# whose run stopped part-way is finished.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag to release, as vX.Y.Z"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version:
    name: the tag names the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/app_shell/Cargo.toml | head -1)
          echo "app $version, tag $TAG"
          test "v$version" = "$TAG" || { echo "tag $TAG does not match version $version"; exit 1; }
          grep -q "^## $version\$" crates/app_shell/RELEASE_NOTES.md \
            || { echo "RELEASE_NOTES.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # The oldest supported runner, so the program runs on older systems too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p app_shell -p doc_server
      - run: scripts/package-release.sh linux ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p app_shell -p doc_server
      - shell: bash
        run: scripts/package-release.sh windows ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build for Apple silicon and Intel
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target" -p app_shell -p doc_server
          done
      - run: scripts/package-release.sh macos ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # rust-src: the threaded build rebuilds the standard library.
      - run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rust-src
      - uses: Swatinem/rust-cache@v2
      # wasm-bindgen at the version Cargo.lock pins, and wasm-opt.
      - name: Tools
        run: |
          bindgen=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          mkdir -p "$RUNNER_TEMP/tools"
          curl -sSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$bindgen/wasm-bindgen-$bindgen-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/tools" --strip-components=1
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/tools" --strip-components=1
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - run: scripts/build-web.sh web-dist
      - run: |
          mkdir -p dist
          tar czf "dist/printcad-web-${{ needs.version.outputs.version }}.tar.gz" -C web-dist .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/*

  publish:
    needs: [version, linux, windows, macos, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: The version's release notes
        run: |
          awk -v heading="## ${{ needs.version.outputs.version }}" '
            $0 == heading { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' crates/app_shell/RELEASE_NOTES.md > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "printCAD ${{ needs.version.outputs.version }}" --notes-file notes.md
          fi
