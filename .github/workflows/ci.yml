name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        # glslc/libshaderc: render_vk's build.rs compiles GLSL via shaderc.
        # Vulkan itself is loaded at run time, so nothing links it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            glslc libshaderc-dev

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Comment-rot lint
        run: node scripts/lint-comment-rot.mjs --all

      - name: The host names no workbench
        run: "! git grep -nE 'wb_design|wb_sketch|\"wb\\.(design|part|sketch)\"|core\\.datum' -- crates/app_shell/src ':!crates/app_shell/src/app/seam_lint.rs'"

  platforms:
    # Windows and macOS: the same build, lints and tests as Linux. The shader
    # compiler comes from Homebrew on macOS and is built from its sources on
    # Windows (slow the first time, then cached).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the shader compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install shaderc
          echo "SHADERC_LIB_DIR=$(brew --prefix shaderc)/lib" >> "$GITHUB_ENV"

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
