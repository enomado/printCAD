<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>printCAD</title>
  <link rel="icon" href="printcad.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e12; color: #9aa5b1; }
    body { font: 15px system-ui, sans-serif; }
    /* winit appends the app's canvas to the body; it fills the page. */
    canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; }
    #loading img { width: 56px; height: 56px; display: block; margin: 0 auto 14px; }
    #loading .bar { width: 220px; height: 3px; margin: 14px auto 0; background: #1c232b; border-radius: 2px; overflow: hidden; }
    #loading .bar div { height: 100%; width: 0; background: #4a9eed; transition: width 0.2s; }
    #loading small { display: block; margin-top: 8px; color: #667180; }
    #loading.failed { color: #e86e6e; }
  </style>
  <!-- The headers that let the page's workers share memory, which a static
       host cannot send: a service worker adds them (the page reloads once,
       the first time). -->
  <script src="coi-serviceworker.js"></script>
</head>
<body>
  <div id="loading"><div>
    <img src="printcad.svg" alt="">
    <span>Loading printCAD…</span>
    <div class="bar"><div></div></div>
    <small></small>
  </div></div>
  <script type="module">
    const loading = document.querySelector("#loading");
    const bar = loading.querySelector(".bar div");
    const note = loading.querySelector("small");
    // The app puts its canvas on the page once it starts; the note goes then.
    new MutationObserver((_, watch) => {
      if (document.querySelector("canvas")) {
        loading.remove();
        watch.disconnect();
      }
    }).observe(document.body, { childList: true });

    // The threaded build where the page's workers may share memory, the
    // plain one elsewhere.
    const threaded = self.crossOriginIsolated === true;
    const base = threaded ? "./threads/" : "./";
    // About the size of the module as it arrives, for the bar.
    const EXPECTED = 36e6;
    try {
      const printcad = await import(`${base}printcad.js`);
      const response = await fetch(`${base}printcad_bg.wasm`);
      if (!response.ok) throw new Error(`the module answered ${response.status}`);
      const reader = response.body.getReader();
      const parts = [];
      let received = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value);
        received += value.length;
        bar.style.width = `${Math.min(100, (100 * received) / EXPECTED)}%`;
        note.textContent = `${(received / 1e6).toFixed(0)} MB`;
      }
      const bytes = new Uint8Array(received);
      let at = 0;
      for (const part of parts) {
        bytes.set(part, at);
        at += part.length;
      }
      bar.style.width = "100%";
      note.textContent = "Starting…";
      await printcad.default({ module_or_path: bytes });
    } catch (error) {
      loading.classList.add("failed");
      loading.querySelector("span").textContent = `printCAD could not start: ${error}`;
    }
  </script>
</body>
</html>
