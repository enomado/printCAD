[package]
name = "scripting"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lua scripts run against the application's commands."

[dependencies]
agents = { path = "../agents" }
core_document = { path = "../core_document" }
mlua = { workspace = true, optional = true }
serde_json.workspace = true
uuid.workspace = true

# The console's Lua on a browser page runs in a worker of the page's own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde.workspace = true
tracing.workspace = true
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Worker", "MessageEvent"] }

[features]
# The Lua engine (C, built from source). Without it the runner takes single
# commands only, as a browser build needs.
default = ["lua"]
lua = ["dep:mlua"]
