[package]
name = "transform_gizmo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Move, turn and scale handles drawn on screen: layout, hit-test, the drag and
# its delta, and what to draw as screen shapes in colour roles. No window and no
# painter. Shared with other applications, so it knows nothing of printCAD: see
# README.md before changing it.

[dependencies]
# egui's maths only (`Pos2`, `Vec2`): no window, no painting.
emath = "0.36"
glam.workspace = true
