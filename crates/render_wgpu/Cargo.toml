[package]
name = "render_wgpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
web-time.workspace = true
kernel_api.workspace = true
thiserror.workspace = true
tracing.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
uuid.workspace = true
glam.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
rayon.workspace = true

# In a browser: WebGPU where the browser has it, WebGL2 where it does not,
# and ids drawn from the page's randomness.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu", "webgl"] }
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
# The shaders are checked by the validator wgpu itself runs, without a GPU.
naga = { version = "30", features = ["wgsl-in"] }
